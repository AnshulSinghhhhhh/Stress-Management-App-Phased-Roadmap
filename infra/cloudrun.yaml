apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: stress-management-backend
spec:
  template:
    spec:
      containers:
        - image: gcr.io/PROJECT_ID/backend:latest
          resources:
            limits:
              memory: 512Mi
              cpu: "1"
          env:
            - name: PORT
              value: "8000"
